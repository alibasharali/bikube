appId: com.drovr.app
productName: Drovr
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**'
  # The `board` CLI runs as plain Node from real files (#9 D4).
  - out/main/board-cli.js
  - out/main/chunks/**
# The `board` wrapper, put first on PATH in every card's shell (#9 D3, D4).
extraResources:
  - from: resources/bin
    to: bin
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  identity: null
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
# Linux release: AppImage and .deb, x64 only (#14 D2, D4, D5). Chromium's
# sandbox stays on: no sandbox-disabling flags here (#14 D6).
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  executableName: drovr
  maintainer: Drovr
appImage:
  artifactName: ${name}-${version}-x86_64.${ext}
  # electron-builder otherwise puts --no-sandbox in the AppImage's desktop entry.
  executableArgs: []
deb:
  artifactName: ${name}-${version}-amd64.${ext}
npmRebuild: true
publish: null
