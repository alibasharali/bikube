appId: com.drovr.app
productName: Drovr
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**'
  # The `board` CLI runs as plain Node from real files (#9 D4).
  - out/main/board-cli.js
  - out/main/chunks/**
# The `board` wrapper, put first on PATH in every card's shell (#9 D3, D4), and the Claude
# settings file and instruction beside it (#31 D14).
extraResources:
  - from: resources/bin
    to: bin
  # The zsh, bash and fish shell integration scripts every local shell starts with (#45 D3).
  - from: resources/shell-integration
    to: shell-integration
  # Licences of the bundled themes and symbols font.
  - from: THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
mac:
  category: public.app-category.developer-tools
  # The .dmg for a first install; the zip is what the in-app updater downloads (src/core/updates.ts
  # names it). The dmg keeps its own name below.
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  # No Developer ID: signed ad hoc, so the whole bundle is sealed. Skipping signing leaves only
  # Electron's linker signature, which a downloaded copy fails as "damaged", with no Open Anyway.
  # Hardened runtime would refuse Electron's own frameworks under an ad-hoc signature.
  identity: '-'
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
# Linux release: AppImage and .deb, x64 only (#14 D2, D4, D5).
# Chromium's sandbox stays on: no sandbox-disabling flags here (#14 D6). The AppImage's AppRun
# (electron-builder's, not configurable) adds --no-sandbox where user namespaces are blocked;
# D6 accepts that.
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  executableName: drovr
  maintainer: Drovr
appImage:
  artifactName: ${name}-${version}-x86_64.${ext}
  # electron-builder otherwise puts --no-sandbox in the AppImage's desktop entry.
  executableArgs: []
# The .deb's install script (electron-builder's default) loads an AppArmor profile so the
# sandbox works where user namespaces are restricted (#14 D5); keep it.
deb:
  artifactName: ${name}-${version}-amd64.${ext}
npmRebuild: true
publish: null
