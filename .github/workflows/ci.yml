name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  # job id is the required status check in the develop/main rulesets; don't rename it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: .claude/check.sh
      - name: Electron smoke test
        run: xvfb-run -a npm run test:smoke
      # later slices add here: actionlint
